[package]
name = "shakedown"
version = "0.1.7"
edition = "2021"
description = "Linux hardware stress testing application with GUI"
authors = ["JDKarner & Claude Opus 4.5"]
license = "GPLv2"

[dependencies]
system76-power = { git = "https://github.com/pop-os/system76-power", optional = true }

# GUI
eframe = "0.31"
egui = "0.31"
egui_extras = "0.31"

# Async runtime
tokio = { version = "1.45", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# System monitoring
sysinfo = "0.35"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Process management
nix = { version = "0.30", features = ["signal", "process"] }

# File watching
notify = "8.0"

[dev-dependencies]
tempfile = "3"

[features]
default = ["lmsensors"]
system76 = ["system76-power"]
lmsensors = []

[profile.release]
opt-level = 3
lto = true
strip = true
